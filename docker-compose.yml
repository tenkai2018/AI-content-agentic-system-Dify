version: "3.9"

# ==============================================================================
# AI Content Agentic System — Infrastructure (Refactored for Dify + n8n)
# Khởi chạy: docker compose up -d
# Dừng:      docker compose down
# Reset DB:  docker compose down -v  (XÓA toàn bộ data)
# ==============================================================================

networks:
  content_network:
    name: content_network
    driver: bridge

services:

  # ============================================================
  # PostgreSQL — State/Log/Content History Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: content_agent_postgres
    restart: unless-stopped
    networks:
      - content_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-content_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-content_machine}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-content_agent} -d ${POSTGRES_DB:-content_machine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # n8n — Workflow Automation (YouTube API, Webhooks, Crons)
  # Truy cập UI: http://localhost:5678
  # ============================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: content_agent_n8n
    restart: unless-stopped
    networks:
      - content_network
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change_this_key_in_production}
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      # Kết nối n8n với Postgres
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-content_machine}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-content_agent}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

# ============================================================
# Persistent Volumes
# ============================================================
volumes:
  postgres_data:
    name: content_agent_postgres_data
  n8n_data:
    name: content_agent_n8n_data
