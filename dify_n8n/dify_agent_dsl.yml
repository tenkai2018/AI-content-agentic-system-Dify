app:
  icon: "🤖"
  icon_background: "#EAF2FF"
  mode: workflow
  name: Content Machine Brain
workflow:
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
    opening_statement: "Content Machine Brain is ready."
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      - id: edge-start-script
        source: "start-node"
        sourceHandle: source
        target: "script-node"
        targetHandle: target
        type: custom
        data:
          sourceType: start
          targetType: llm
          isInIteration: false
      - id: edge-script-visual
        source: "script-node"
        sourceHandle: source
        target: "visual-node"
        targetHandle: target
        type: custom
        data:
          sourceType: llm
          targetType: llm
          isInIteration: false
      - id: edge-visual-repurpose
        source: "visual-node"
        sourceHandle: source
        target: "repurpose-node"
        targetHandle: target
        type: custom
        data:
          sourceType: llm
          targetType: llm
          isInIteration: false
      - id: edge-repurpose-end
        source: "repurpose-node"
        sourceHandle: source
        target: "end-node"
        targetHandle: target
        type: custom
        data:
          sourceType: llm
          targetType: end
          isInIteration: false
    nodes:
      - id: "start-node"
        type: custom
        width: 244
        height: 118
        position:
          x: 30
          y: 300
        positionAbsolute:
          x: 30
          y: 300
        sourcePosition: right
        targetPosition: left
        data:
          type: start
          title: Start
          desc: ""
          selected: false
          variables:
            - variable: niche
              label: Niche
              type: text-input
              required: true
              max_length: 255
              options: []
            - variable: selected_title
              label: Selected Title
              type: text-input
              required: true
              max_length: 255
              options: []
            - variable: language
              label: Language
              type: text-input
              required: false
              max_length: 32
              options: []
            - variable: reference_thumbnail_url
              label: Reference Thumbnail URL
              type: text-input
              required: false
              max_length: 500
              options: []

      - id: "script-node"
        type: custom
        width: 244
        height: 126
        position:
          x: 330
          y: 300
        positionAbsolute:
          x: 330
          y: 300
        sourcePosition: right
        targetPosition: left
        data:
          type: llm
          title: Scriptwriter Agent
          desc: "Generate script JSON"
          selected: false
          context:
            enabled: false
            variable_selector: []
          model:
            provider: openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.6
          prompt_template:
            - role: system
              text: |
                You are the Scriptwriter Agent for short-form vertical video.
                Return strict JSON only with fields:
                agent, step, topic, estimated_duration_seconds, script{hook{identify,missed_opportunity,outcome,visual_preview},credibility,main_content[],cta,full_script_text}
            - role: user
              text: |
                Niche: {{#start-node.niche#}}
                Title: {{#start-node.selected_title#}}
                Language: {{#start-node.language#}}
          vision:
            enabled: false
            configs:
              detail: high

      - id: "visual-node"
        type: custom
        width: 244
        height: 126
        position:
          x: 630
          y: 300
        positionAbsolute:
          x: 630
          y: 300
        sourcePosition: right
        targetPosition: left
        data:
          type: llm
          title: Visual Director Agent
          desc: "Generate thumbnail brief JSON"
          selected: false
          context:
            enabled: false
            variable_selector: []
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.4
          prompt_template:
            - role: system
              text: |
                You are the Visual Director Agent.
                Return strict JSON only with fields:
                agent, step, pattern_summary, brief{concept,background,color_palette,text_overlay,person,emotion_target,avoid}
            - role: user
              text: |
                Script JSON:
                {{#script-node.text#}}
                Reference thumbnail URL:
                {{#start-node.reference_thumbnail_url#}}
          vision:
            enabled: false
            configs:
              detail: high

      - id: "repurpose-node"
        type: custom
        width: 244
        height: 126
        position:
          x: 930
          y: 300
        positionAbsolute:
          x: 930
          y: 300
        sourcePosition: right
        targetPosition: left
        data:
          type: llm
          title: Repurposer Agent
          desc: "Generate LinkedIn post JSON"
          selected: false
          context:
            enabled: false
            variable_selector: []
          model:
            provider: openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.7
          prompt_template:
            - role: system
              text: |
                You are the Repurposer Agent.
                Return strict JSON only with fields:
                agent, step, source_topic, posts{personal_story,strong_opinion,step_by_step,question_hook,data_insight,failure_lesson}
            - role: user
              text: |
                Script JSON:
                {{#script-node.text#}}
          vision:
            enabled: false
            configs:
              detail: high

      - id: "end-node"
        type: custom
        width: 244
        height: 106
        position:
          x: 1230
          y: 300
        positionAbsolute:
          x: 1230
          y: 300
        sourcePosition: right
        targetPosition: left
        data:
          type: end
          title: End
          desc: ""
          selected: false
          outputs:
            - variable: script_result
              value_selector:
                - script-node
                - text
            - variable: thumbnail_brief
              value_selector:
                - visual-node
                - text
            - variable: linkedin_posts
              value_selector:
                - repurpose-node
                - text
